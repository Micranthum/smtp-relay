services:
  redis:
    image: redis:7-alpine
    container_name: smtp-relay-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - smtp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp-relay:
    build: .
    container_name: smtp-relay
    restart: unless-stopped
    ports:
      - "${SMTP_STARTTLS_PORT:-587}:${SMTP_STARTTLS_PORT:-587}"
      - "${SMTP_SSL_PORT:-465}:${SMTP_SSL_PORT:-465}"
      - "${METRICS_PORT:-8000}:${METRICS_PORT:-8000}"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./token_cache:/app/token_cache
      - ./certs:/app/certs:ro
      - prometheus-multiproc:/tmp/prometheus_multiproc
    environment:
      - TZ=America/Mexico_City
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_STARTTLS_PORT', '587')))); s.close()\" && python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_SSL_PORT', '465')))); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    container_name: smtp-relay-worker
    restart: unless-stopped
    command: ["python", "-u", "-m", "src.worker"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./token_cache:/app/token_cache
      - prometheus-multiproc:/tmp/prometheus_multiproc
    environment:
      - TZ=America/Mexico_City
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smtp-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-multiproc:

services:
  redis:
    image: redis:7-alpine
    container_name: smtp-relay-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - smtp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp-relay:
    build: .
    container_name: smtp-relay
    restart: unless-stopped
    ports:
      - "${SMTP_STARTTLS_PORT:-587}:${SMTP_STARTTLS_PORT:-587}"
      - "${SMTP_SSL_PORT:-465}:${SMTP_SSL_PORT:-465}"
      - "${METRICS_PORT:-8000}:${METRICS_PORT:-8000}"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
      - prometheus-multiproc:/tmp/prometheus_multiproc
    environment:
      - TZ=America/Mexico_City
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_STARTTLS_PORT', '587')))); s.close()\" && python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_SSL_PORT', '465')))); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    container_name: smtp-relay-worker
    restart: unless-stopped
    command: ["python", "-u", "-m", "src.worker"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - prometheus-multiproc:/tmp/prometheus_multiproc
    environment:
      - TZ=America/Mexico_City
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    healthcheck:
      disable: true
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: smtp-relay-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-90d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - smtp-network
    depends_on:
      - smtp-relay

  alertmanager:
    image: prom/alertmanager:latest
    container_name: smtp-relay-alertmanager
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./monitoring/render-alertmanager-config.sh:/etc/alertmanager/render-and-run.sh:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-and-run.sh"]
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - smtp-network

networks:
  smtp-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-multiproc:
  prometheus-data:
  alertmanager-data:

services:
  smtp-relay:
    build: .
    container_name: smtp-relay-contpaq
    restart: unless-stopped
    ports:
      - "${SMTP_STARTTLS_PORT:-587}:${SMTP_STARTTLS_PORT:-587}"
      - "${SMTP_SSL_PORT:-465}:${SMTP_SSL_PORT:-465}"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./token_cache:/app/token_cache
      - ./certs:/app/certs:ro  # Mount certificates directory (read-only)
    environment:
      - TZ=America/Mexico_City
    networks:
      - smtp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_STARTTLS_PORT', '587')))); s.close()\" && python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_SSL_PORT', '465')))); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  smtp-network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: smtp-relay-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - smtp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp-relay:
    build: .
    container_name: smtp-relay
    restart: unless-stopped
    ports:
      - "${SMTP_STARTTLS_PORT:-587}:${SMTP_STARTTLS_PORT:-587}"
      - "${SMTP_SSL_PORT:-465}:${SMTP_SSL_PORT:-465}"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./token_cache:/app/token_cache
      - ./certs:/app/certs:ro
    environment:
      - TZ=America/Mexico_City
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_STARTTLS_PORT', '587')))); s.close()\" && python -c \"import socket, os; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int(os.getenv('SMTP_SSL_PORT', '465')))); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  celery-worker:
    build: .
    container_name: smtp-relay-celery-worker
    restart: unless-stopped
    command: /app/scripts/start_celery.sh
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./token_cache:/app/token_cache
    environment:
      - TZ=America/Mexico_City
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flower:
    build: .
    container_name: smtp-relay-flower
    restart: unless-stopped
    command: celery -A src.celery_app flower --port=5555 --broker=${CELERY_BROKER_URL:-redis://redis:6379/0}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
    networks:
      - smtp-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smtp-network:
    driver: bridge

volumes:
  redis-data:
